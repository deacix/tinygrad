# The Legwork build of tinygrad (deacix/legwork ADR-23683). This branch is the
# v0.14.0 tag plus a narrow delta: the tinygrad.llm.kernels package entry and the
# tinygrad.llm layer placement. The gate holds the runtime, the engine and
# tensor.py byte-equal to the tag, so every Legwork launcher seam written against
# 0.14.0 stays valid, and runs the llm suites on CPU.
#
# Release: LEGWORK_VERSION is the release counter n. After the gate passes on a
# push to legwork/v0.14.0, the release job publishes v0.14.0-legwork.<n> unless
# that release already exists, so bumping LEGWORK_VERSION (with the matching
# pyproject version) is how a new wheel ships. GitHub serves the asset at a URL
# with the "+" of the wheel's version percent-encoded: the notes and the run
# summary record the served name and URL beside the canonical file name
# installers must save it as, since pip and uv read the version from it.
name: Legwork build

on:
  push:
    branches:
      - legwork/**
  pull_request:
    branches:
      - legwork/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legwork-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: runtime equals v0.14.0; llm suites on CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[testing_unit]' pytest-xdist ruff
      - name: Version is 0.14.0+legwork.<LEGWORK_VERSION>
        run: |
          n="$(tr -d '[:space:]' < LEGWORK_VERSION)"
          [[ "$n" =~ ^[1-9][0-9]*$ ]] || { echo "::error::LEGWORK_VERSION must be a positive integer, read '$n'"; exit 1; }
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$version" == "0.14.0+legwork.$n" ]] || { echo "::error::pyproject version is $version, LEGWORK_VERSION wants 0.14.0+legwork.$n"; exit 1; }
      - name: Runtime, engine and tensor.py equal v0.14.0
        run: git diff --stat --exit-code v0.14.0 -- tinygrad/runtime tinygrad/engine tinygrad/tensor.py
      - name: Ruff on tinygrad/llm
        run: python -m ruff check tinygrad/llm
      - name: llm suites on CPU
        env:
          DEV: CPU
          BEAM: '0'
        run: >-
          python -m pytest -q -n auto
          test/unit/test_gguf.py
          test/unit/test_gguf_placement.py
          test/unit/test_llm_placement.py
          test/unit/test_llm_placement_execution.py
          test/unit/test_llm_placement_server.py
          test/unit/test_llm_placement_qwen.py
          test/unit/test_llm_server.py
          test/null/test_llm_server.py

  release:
    name: publish the wheel for a new LEGWORK_VERSION
    needs: gate
    if: github.ref == 'refs/heads/legwork/v0.14.0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Is this version published?
        id: plan
        run: |
          n="$(tr -d '[:space:]' < LEGWORK_VERSION)"
          tag="v0.14.0-legwork.$n"
          {
            echo "version=0.14.0+legwork.$n"
            echo "tag=$tag"
            echo "wheel=tinygrad-0.14.0+legwork.$n-py3-none-any.whl"
          } >> "$GITHUB_OUTPUT"
          # A published release holds its tag; a draft does not, so a failed run's draft never blocks the retry.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the wheel and SHA256SUMS
        if: steps.plan.outputs.exists == 'false'
        env:
          WHEEL: ${{ steps.plan.outputs.wheel }}
        run: |
          pip install build
          python -m build --wheel
          built=(dist/*)
          [[ ${#built[@]} -eq 1 && "${built[0]}" == "dist/$WHEEL" ]] || { echo "::error::expected only dist/$WHEEL, found: ${built[*]}"; exit 1; }
          for module in tinygrad/llm/kernels/amd.py tinygrad/llm/placement.py; do
            unzip -l "dist/$WHEEL" | grep -q " $module\$" || { echo "::error::$WHEEL lacks $module"; exit 1; }
          done
          (cd dist && sha256sum "$WHEEL" > SHA256SUMS)
      - name: Publish after verifying the served bytes
        if: steps.plan.outputs.exists == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          WHEEL: ${{ steps.plan.outputs.wheel }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          sha="$(cut -d' ' -f1 dist/SHA256SUMS)"
          url="" verified=""
          # Written whatever the verdict, so a red run still names how far the release got.
          summary() {
            local status=$?
            {
              if [[ $status -eq 0 ]]; then echo "### Published $TAG"; else echo "### $TAG not verified (exit $status)"; fi
              echo
              echo "The pin (deacix/legwork \`TINYGRAD_FORK_PIN\`), verified: ${verified:-nothing yet}."
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| version | \`$VERSION\` |"
              echo "| tag | \`$TAG\` |"
              echo "| commit | \`$GITHUB_SHA\` |"
              echo "| assetUrl | ${url:--} |"
              echo "| wheelFile | \`$WHEEL\` |"
              echo "| sha256 | \`$sha\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap summary EXIT
          notes() {
            echo "The Legwork build of tinygrad: v0.14.0 plus the tinygrad.llm kernels package and layer placement (deacix/legwork ADR-23683)."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Canonical wheel file: \`$WHEEL\`. Save the download under this name: pip reads the version from it."
            echo "- sha256: \`$sha\` (also in \`SHA256SUMS\`)"
            if [[ $# -gt 0 ]]; then echo "- Served asset: \`$1\` at $2, GitHub digest \`$3\`"; fi
          }
          encode() { python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1"; }
          # The draft by id, never by listing: a draft holds no tag, so a
          # failed run's draft is harmless and the retry makes its own.
          notes > notes.md
          echo "creating the draft $TAG at $GITHUB_SHA"
          id="$(gh api -X POST "$api" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$TAG" -F draft=true -F body=@notes.md --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::the draft for $TAG was not created ('$id')"; exit 1; }
          for file in "dist/$WHEEL" dist/SHA256SUMS; do
            echo "uploading $(basename "$file") to draft $id"
            gh api -X POST -H 'Content-Type: application/octet-stream' --input "$file" --silent \
              "https://uploads.github.com/$api/$id/assets?name=$(encode "$(basename "$file")")"
          done
          echo "reading the draft's assets back"
          read -r served asset digest < <(gh api "$api/$id" --jq '.assets[] | select(.name | endswith(".whl")) | [.name, .id, .digest] | @tsv')
          gh api -H 'Accept: application/octet-stream' "$api/assets/$asset" > uploaded.whl
          [[ "$(sha256sum uploaded.whl | cut -d' ' -f1)" == "$sha" ]] || { echo "::error::the uploaded asset differs from the built wheel"; exit 1; }
          [[ "$digest" == "sha256:$sha" ]] || { echo "::error::GitHub's asset digest '$digest' is not sha256:$sha"; exit 1; }
          verified="the uploaded bytes and GitHub's digest"
          # GitHub serves the asset at its name percent-encoded ("+" is %2B).
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(encode "$served")"
          notes "$served" "$url" "$digest" > notes.md
          echo "publishing draft $id"
          gh api -X PATCH "$api/$id" -F draft=false -F body=@notes.md --silent
          published="$(gh api "$api/tags/$TAG" --jq '.assets[] | select(.name | endswith(".whl")) | .browser_download_url')"
          [[ "$published" == "$url" ]] || { echo "::error::the published asset URL is '$published', expected $url"; exit 1; }
          curl -fsSL --retry 3 -o public.whl "$url"
          [[ "$(sha256sum public.whl | cut -d' ' -f1)" == "$sha" ]] || { echo "::error::the public download differs from the built wheel"; exit 1; }
          verified="the uploaded bytes, GitHub's digest and the public download"
